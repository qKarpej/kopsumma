services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kopsumma
      POSTGRES_DB: kopsumma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kopsumma"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
