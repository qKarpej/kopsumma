name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Linteris (ruff)
        run: ruff check .
      - name: Testi (pytest)
        run: pytest -q
      - name: Migrācija tukšā datubāzē
        if: hashFiles('backend/alembic.ini') != ''
        run: DATABASE_URL=sqlite:///./ci.db alembic upgrade head

  mock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Testa servera testi
        run: pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Linteris (flutter analyze)
        run: |
          flutter --version
          flutter analyze > analyze.txt 2>&1 || { grep -E "(error|warning|info) •" analyze.txt | sed 's/^/::error::/'; exit 1; }
      - name: Testi (flutter test)
        run: |
          flutter test --reporter json > test-results.json || true
          python3 ../tool/flutter_failures.py test-results.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Viena komanda — API + DB + demo dati
        run: docker compose up -d --build --wait db api
      - name: Pārbaude ar curl
        run: |
          set -e
          curl -fsS localhost:8000/api/v1/platforms
          TOKEN=$(curl -fsS -X POST localhost:8000/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"epasts":"anna@inbox.lv","parole":"Kopsumma2026"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          curl -fsS localhost:8000/api/v1/portfolio -H "Authorization: Bearer $TOKEN"
          curl -fsS -X POST localhost:8000/api/v1/imports -H "Authorization: Bearer $TOKEN" \
            -F platformas_id=2 -F fails=@demo/twino_2026-10-11.csv
      - name: Web būvējums (Flutter → nginx)
        run: docker compose build web
      - if: failure()
        run: docker compose logs api

